name: iOS Simulator Screenshots

on:
  workflow_dispatch:
  push:

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project and pick simulator
        run: |
          xcodebuild -version
          mkdir -p work && unzip -q -o NEW_14502278Q2_iOS_for_github.zip -d work
          echo "PROJ_DIR=$GITHUB_WORKSPACE/work/14502278Q2_iOS" >> $GITHUB_ENV
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          best=None
          for rt,devs in d.items():
              if "iOS" not in rt: continue
              for x in devs:
                  n=x["name"]
                  if n.startswith("iPhone") and "SE" not in n:
                      best=(rt,x["udid"],n) if best is None or rt>best[0] else best
          print(best[1]); print(best[2],file=sys.stderr)')
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV

      - name: Build and run UI test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/screenshots"
          cd "$PROJ_DIR"
          TEST_RUNNER_SCREENSHOT_DIR="$GITHUB_WORKSPACE/screenshots" \
          xcodebuild test \
            -project 14502278Q2_iOS.xcodeproj \
            -scheme 14502278Q2_iOS \
            -destination "id=$DEVICE_ID" \
            -resultBundlePath "$GITHUB_WORKSPACE/TestResult.xcresult" \
            CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM=""

      - name: Export screenshots from test result (backup)
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/screenshots/from_xcresult"
          xcrun xcresulttool export attachments --path "$GITHUB_WORKSPACE/TestResult.xcresult" \
            --output-path "$GITHUB_WORKSPACE/screenshots/from_xcresult" || true
          ls -R "$GITHUB_WORKSPACE/screenshots"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
